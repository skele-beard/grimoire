<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            background: #1a1a1a;
            font-family: 'Courier New', monospace;
            color: #d0d0d0;
            padding: 0;
            position: relative;
            border: 3px solid #2a2a2a;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* CRT scanline effect */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.08),
                rgba(0, 0, 0, 0.08) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Vignette */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 9;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 20px;
            animation: flicker 0.15s infinite;
        }

        .header {
            border: 2px solid #3a3a3a;
            background: #1f1f1f;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 0 #0a0a0a;
        }

        h1 {
            font-size: 18px;
            text-align: left;
            margin-bottom: 4px;
            color: #a0a0a0;
            font-weight: normal;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 10px;
            color: #6a6a6a;
            letter-spacing: 1px;
        }

        .window {
            border: 2px solid #3a3a3a;
            background: #1f1f1f;
            margin-bottom: 10px;
            box-shadow: 0 4px 0 #0a0a0a;
        }

        .window-title {
            background: #2a2a2a;
            padding: 4px 8px;
            font-size: 11px;
            color: #808080;
            border-bottom: 1px solid #3a3a3a;
            letter-spacing: 1px;
        }

        .window-content {
            padding: 10px 12px;
        }

        /* Status row */
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #5a5a5a;
            border: 1px solid #3a3a3a;
            flex-shrink: 0;
        }

        .status-indicator.active {
            background: #909090;
            box-shadow: 0 0 6px #808080;
        }

        .status-text {
            color: #b0b0b0;
            font-size: 11px;
        }

        /* Current page info rows */
        .info-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 3px 0;
        }

        .info-row + .info-row {
            border-top: 1px solid #242424;
        }

        .info-label {
            font-size: 9px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-width: 52px;
            flex-shrink: 0;
        }

        .info-value {
            font-size: 11px;
            color: #909090;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 240px;
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            color: #a0a0a0;
            border: 2px solid #3a3a3a;
            border-bottom: 3px solid #0a0a0a;
            border-right: 3px solid #0a0a0a;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.1s;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        button:hover:not(:disabled) {
            background: #353535;
            color: #b0b0b0;
            border-color: #4a4a4a;
        }

        button:active:not(:disabled) {
            border-bottom: 2px solid #000;
            border-right: 2px solid #000;
            transform: translate(1px, 1px);
        }

        button:disabled {
            color: #444;
            border-color: #282828;
            cursor: default;
        }

        button:last-child {
            margin-bottom: 0;
        }

        .footer {
            border-top: 1px solid #3a3a3a;
            padding: 8px 0 0;
            margin-top: 10px;
        }

        .info {
            font-size: 9px;
            color: #6a6a6a;
            text-align: center;
            letter-spacing: 1px;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.98; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GRIMOIRE</h1>
            <div class="subtitle">PASSWORD VAULT</div>
        </div>

        <div class="window">
            <div class="window-title">STATUS</div>
            <div class="window-content">
                <div class="status">
                    <div id="statusIndicator" class="status-indicator"></div>
                    <div id="statusText" class="status-text">Initializing...</div>
                </div>
            </div>
        </div>

        <div class="window">
            <div class="window-title">CURRENT PAGE</div>
            <div class="window-content">
                <div class="info-row">
                    <span class="info-label">DOMAIN</span>
                    <span id="domainText" class="info-value">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">STORED</span>
                    <span id="credentialStatus" class="info-value">—</span>
                </div>
            </div>
        </div>

        <button id="fillButton" disabled>[ AUTOFILL ]</button>
        <button id="testButton">[ TEST CONNECTION ]</button>

        <div class="footer">
            <div class="info">GRIMOIRE PASSWORD MANAGER</div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
